spring:
  application:
    name: nutrigain-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3310/nutrigain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8081}

nutrigain:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-of-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://nutrigain-frontend.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
